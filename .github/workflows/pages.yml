name: Historia auf GitHub Pages veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Quelltext laden
        uses: actions/checkout@v4

      - name: pnpm einrichten
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile

      - name: Statische PWA bauen
        run: pnpm build

      - name: GitHub-Pages-Routen vorbereiten
        run: pnpm pages:prepare

      - name: GitHub Pages vorbereiten
        uses: actions/configure-pages@v5

      - name: Seitenpaket hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
